<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flickeys">
<title>Flickeys</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap');

  :root {
    --black: #050505;
    --panel: #0d0d0d;
    --panel-hover: #141414;
    --gold: #D4AF37;
    --gold-dim: rgba(212, 175, 55, 0.4);
    --gold-mute: #C5A059;
    --ink: #F5F5F5;
    --ink-muted: #888888;
    --line: rgba(212, 175, 55, 0.15);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--black); }

  body {
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  ::-webkit-scrollbar {
    height: 4px;
    width: 6px;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--gold-dim);
    border-radius: 4px;
  }

  #app-root {
    min-height: 100vh;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 40px) 16px env(safe-area-inset-bottom, 32px);
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .header { text-align: center; margin-bottom: 32px; padding-top: 20px; }
  .title {
    font-family: 'Cinzel', serif;
    font-size: 54px;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin: 0;
    background: linear-gradient(to right, #D4AF37, #FFF5D1, #D4AF37);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 25px rgba(212, 175, 55, 0.25);
    text-transform: uppercase;
  }
  .sub { color: var(--ink-muted); font-size: 14px; margin: 8px 0 0; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 500; }

  .region-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .region-btn {
    flex: 1;
    font-family: 'Work Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 10px 4px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .region-btn.active {
    background: var(--gold);
    color: var(--black);
    font-weight: 600;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
  }

  .genres-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .genre-chip {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .genre-chip:hover {
    background: var(--panel-hover);
    border-color: var(--gold-dim);
  }
  .genre-chip.active {
    background: var(--gold);
    color: var(--black);
    border-color: var(--gold);
    font-weight: 600;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
  }

  .progress { font-size: 12px; color: var(--gold-dim); margin-bottom: 24px; text-align: center; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }

  .stage { width: 100%; display: flex; flex-direction: column; gap: 18px; }
  
  .film-card {
    background: linear-gradient(145deg, var(--panel), #0a0a0a);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transform: translateY(20px) scale(0.98);
    filter: blur(4px);
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  
  .film-card.reveal {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
  
  .film-card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 15px 35px rgba(212, 175, 55, 0.05);
    border-color: var(--gold-dim);
  }

  .film-title { font-family: 'Cinzel', serif; font-size: 24px; font-weight: 700; letter-spacing: 0.05em; margin: 0; color: var(--gold); }
  .film-meta { font-size: 12px; color: var(--gold-mute); margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .film-desc { font-size: 14px; line-height: 1.6; color: var(--ink); margin: 6px 0 16px; font-weight: 400; }
  
  .film-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; border-top: 1px solid var(--line); padding-top: 16px; }
  
  .watched-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); cursor: pointer; transition: color 0.2s; }
  .watched-check:hover { color: var(--ink); }
  .watched-check input { accent-color: var(--gold); cursor: pointer; width: 18px; height: 18px; }

  .imdb-link {
    font-size: 13px; font-weight: 600; text-decoration: none;
    color: var(--black); background: var(--gold);
    padding: 8px 16px; border-radius: 8px;
    transition: all 0.2s;
  }
  .imdb-link:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
  }

  .loading-container { padding: 60px 0; display: flex; justify-content: center; align-items: center; }
  .loading-ring {
    display: inline-block; width: 40px; height: 40px;
    border: 3px solid rgba(212, 175, 55, 0.1);
    border-radius: 50%;
    border-top-color: var(--gold);
    animation: spin 1s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; color: var(--ink-muted); font-size: 14px; margin: 60px 0; letter-spacing: 0.02em; }
  
  .actions { display: flex; gap: 12px; margin-top: 24px; }
  .btn {
    flex: 1; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 600;
    padding: 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--gold);
    background: transparent; color: var(--gold);
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .btn.primary { 
    background: var(--gold); 
    color: var(--black); 
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
  }
  .btn.primary:hover {
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<div id="app-root">
  <div class="header">
    <h1 class="title">Flickeys</h1>
    <p class="sub">Curated Cinema &bull; Zero Interruptions</p>
  </div>

  <div class="region-toggle" id="region-toggle">
    <button class="region-btn active" data-region="Hollywood">Hollywood</button>
    <button class="region-btn" data-region="Indian Cinema">Indian Cinema</button>
    <button class="region-btn" data-region="Korean Cinema">Korean Cinema</button>
  </div>

  <div class="genres-scroll" id="genres-scroll"></div>
  <p class="progress" id="progress"></p>

  <div class="stage" id="stage"></div>
  <div class="empty" id="empty-state">Select a genre to reveal your lineup.</div>
  
  <div class="actions" id="actions" style="display: none;">
    <button class="btn primary" id="btn-reroll">Refresh Lineup</button>
  </div>
</div>

  const API_KEY = 'AQ.Ab8RN6I_M_Xq8UX3caTZbnAbezBkXGQ-0zuQLaSuCADikWqNAg';
  const MODEL = 'gemini-3.6-flash';

  const genresEl = document.getElementById('genres-scroll');
  const stageEl = document.getElementById('stage');
  const emptyEl = document.getElementById('empty-state');
  const progressEl = document.getElementById('progress');
  const regionToggleEl = document.getElementById('region-toggle');
  const actionsEl = document.getElementById('actions');

  let currentGenre = null;
  let currentRegion = 'Hollywood';
  let watched = { films: [] };
  let sessionSeen = { films: [] };

  function loadWatched() {
    try {
      const raw = localStorage.getItem('flickeys-watched-v3');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.films) watched.films = parsed.films;
      }
    } catch (e) { watched = { films: [] }; }
  }

  function saveWatched() {
    try { localStorage.setItem('flickeys-watched-v3', JSON.stringify(watched)); } 
    catch (e) {}
  }

  function updateProgress() {
    progressEl.textContent = `${watched.films.length} Films Logged`;
  }

  function getOfflinePicks(genre, region) {
    const list = MOVIE_DB[region][genre] || [];
    
    let unwatched = list.filter(m => {
        const id = `${m.title} (${m.year})`;
        return !watched.films.includes(id);
    });

    if (unwatched.length < 3) unwatched = list;

    let available = unwatched.filter(m => {
        const id = `${m.title} (${m.year})`;
        return !sessionSeen.films.includes(id);
    });

    if (available.length < 3) {
        const currentlyOnScreen = sessionSeen.films.slice(-3);
        sessionSeen.films = [...currentlyOnScreen];
        
        available = unwatched.filter(m => {
            const id = `${m.title} (${m.year})`;
            return !sessionSeen.films.includes(id);
        });
        
        if (available.length < 3) available = unwatched;
    }

    const shuffled = [...available].sort(() => 0.5 - Math.random());
    const picks = shuffled.slice(0, 3);
    
    return picks.map(p => ({...p, source: 'offline'}));
  }

  async function fetchPicks(genre, region) {
    const avoidList = [...new Set([...watched.films, ...sessionSeen.films])].slice(-50);
    
    const promptText = `Suggest exactly 3 well-known, highly rated ${region} movies for the genre '${genre}'. Do not suggest any of these: ${avoidList.join(', ')}. Respond ONLY with raw JSON in this exact format: {"films": [ {"title":"Movie Name","year":"YYYY","genre":"...","desc":"One short sentence.","imdb_rating":"X.X"}, {"title":"Movie Name","year":"YYYY","genre":"...","desc":"One short sentence.","imdb_rating":"X.X"}, {"title":"Movie Name","year":"YYYY","genre":"...","desc":"One short sentence.","imdb_rating":"X.X"} ]}`;

    try {
        const response = await fetch('https://text.pollinations.ai/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messages: [
                    { role: 'system', content: 'You are a movie recommendation engine that responds ONLY with valid JSON. No markdown, no text outside the JSON object.' },
                    { role: 'user', content: promptText }
                ],
                model: 'openai',
                jsonMode: true,
                seed: Math.floor(Math.random() * 1000000)
            })
        });

        if (!response.ok) {
            throw new Error(`HTTP Error ${response.status}`);
        }

        let text = await response.text();
        text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
        
        const firstBrace = text.indexOf('{');
        const lastBrace = text.lastIndexOf('}');
        if (firstBrace !== -1 && lastBrace !== -1) {
            text = text.substring(firstBrace, lastBrace + 1);
        }
        
        const parsed = JSON.parse(text);
        if (parsed.films && parsed.films.length >= 3) {
            const picks = parsed.films.slice(0, 3);
            return picks.map(p => ({...p, source: 'ai'}));
        }
        
        throw new Error("Invalid JSON structure.");
        
    } catch (error) {
        console.warn(`AI Generation failed: ${error.message}. Silently falling back to offline DB.`);
        return getOfflinePicks(genre, region);
    }
  }

  async function pickAndRender(genre) {
    currentGenre = genre;
    stageEl.innerHTML = `<div class="loading-container"><div class="loading-ring"></div></div>`;
    emptyEl.style.display = 'none';
    actionsEl.style.display = 'none';

    const picks = await fetchPicks(genre, currentRegion);
    
    stageEl.innerHTML = '';
    
    const sourceIndicator = picks[0].source === 'ai' 
        ? `<div style="text-align:center; font-size:10px; color:var(--gold-dim); letter-spacing:0.1em; margin-bottom: 10px;">✦ GENERATED BY AI</div>`
        : `<div style="text-align:center; font-size:10px; color:var(--ink-muted); letter-spacing:0.1em; margin-bottom: 10px;">✦ CURATED DATABASE</div>`;
    
    stageEl.innerHTML += sourceIndicator;

    picks.forEach((film, index) => {
        sessionSeen.films.push(`${film.title} (${film.year})`);
        const q = encodeURIComponent(`${film.title} ${film.year}`);
        const imdbUrl = `https://www.imdb.com/find/?q=${q}&s=tt&ttype=ft`;
        const filmId = `${film.title} (${film.year})`;
        const isWatched = watched.films.includes(filmId);

        const card = document.createElement('div');
        card.className = 'film-card';
        card.innerHTML = `
          <h3 class="film-title">${film.title}</h3>
          <p class="film-meta">${film.year} &bull; ${film.genre}</p>
          <p class="film-desc">${film.desc}</p>
          <div class="film-footer">
            <label class="watched-check">
              <input type="checkbox" value="${filmId}" ${isWatched ? 'checked' : ''}>
              Watched
            </label>
            <a class="imdb-link" href="${imdbUrl}" target="_blank" rel="noopener noreferrer">&#9733; ${film.imdb_rating || "N/A"} IMDb ↗</a>
          </div>
        `;
        
        card.querySelector('input').addEventListener('change', (e) => {
            if (e.target.checked) {
                if (!watched.films.includes(filmId)) watched.films.push(filmId);
            } else {
                watched.films = watched.films.filter(id => id !== filmId);
            }
            saveWatched();
            updateProgress();
        });
        
        stageEl.appendChild(card);
        
        setTimeout(() => {
            card.classList.add('reveal');
        }, 50 + (index * 150));
    });
    
    setTimeout(() => { actionsEl.style.display = 'flex'; }, 500);
  }

  regionToggleEl.addEventListener('click', (e) => {
    if (e.target.classList.contains('region-btn')) {
        document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentRegion = e.target.dataset.region;
        
        sessionSeen.films = []; 
        if (currentGenre) pickAndRender(currentGenre);
    }
  });

  document.getElementById('btn-reroll').addEventListener('click', () => {
      if (currentGenre) pickAndRender(currentGenre);
  });

  function init() {
    loadWatched();
    updateProgress();
    GENRES.forEach(genre => {
      const chip = document.createElement('button');
      chip.className = 'genre-chip';
      chip.textContent = genre;
      chip.addEventListener('click', () => {
        document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        
        sessionSeen.films = []; 
        pickAndRender(genre);
      });
      genresEl.appendChild(chip);
    });
    
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  }

  init();
})();
</script>
