<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flickeys">
<title>Flickeys</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap');

  :root {
    --black: #050505;
    --panel: #0d0d0d;
    --panel-hover: #141414;
    --gold: #D4AF37;
    --gold-dim: rgba(212, 175, 55, 0.4);
    --gold-mute: #C5A059;
    --red: #E6394A;
    --ink: #F5F5F5;
    --ink-muted: #888888;
    --line: rgba(212, 175, 55, 0.15);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--black); font-family: 'Work Sans', sans-serif; color: var(--ink); min-height: 100vh; }

  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }

  #app-root {
    min-height: 100vh;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 30px) 16px env(safe-area-inset-bottom, 32px);
  }

  /* DESKTOP GRID LAYOUT */
  .layout-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .sidebar { margin-bottom: 20px; }
  
  .header { text-align: center; margin-bottom: 24px; padding-top: 10px; cursor: pointer; }
  .title {
    font-family: 'Cinzel', serif; font-size: 48px; font-weight: 700; letter-spacing: 0.15em; margin: 0;
    background: linear-gradient(to right, #D4AF37, #FFF5D1, #D4AF37);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 4px 25px rgba(212, 175, 55, 0.25); text-transform: uppercase;
  }
  .sub { color: var(--ink-muted); font-size: 13px; margin: 8px 0 0; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 500; }

  .nav-group-label { font-size: 11px; color: var(--gold-mute); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; display: block; }

  .toggle-group {
    display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); flex-wrap: wrap;
  }
  .toggle-btn {
    flex: 1; min-width: 45%; font-family: 'Work Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink-muted); background: transparent; border: none; border-radius: 8px; padding: 12px 6px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); text-align: center;
  }
  .toggle-btn.active { background: var(--gold); color: var(--black); font-weight: 600; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }

  .collection-btn {
    width: 100%; background: transparent; border: 1px dashed var(--gold-dim); color: var(--gold); padding: 14px; border-radius: 12px; font-family: 'Work Sans'; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 24px;
  }
  .collection-btn:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); }

  .genres-scroll {
    display: flex; gap: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; margin-bottom: 24px;
  }
  .genre-chip {
    flex-shrink: 0; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 100px; padding: 10px 20px; cursor: pointer; transition: all 0.3s ease; white-space: nowrap;
  }
  .genre-chip:hover { background: var(--panel-hover); border-color: var(--gold-dim); }
  .genre-chip.active { background: var(--gold); color: var(--black); border-color: var(--gold); font-weight: 600; box-shadow: 0 0 15px rgba(212, 175, 55, 0.25); }

  .main-content { flex: 1; }

  .stage { width: 100%; display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
  
  .film-card {
    background: linear-gradient(145deg, var(--panel), #0a0a0a); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transform: translateY(20px) scale(0.98); filter: blur(4px); transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); box-shadow: 0 10px 30px rgba(0,0,0,0.6); height: 100%;
  }
  .film-card.reveal { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  .film-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 15px 35px rgba(212, 175, 55, 0.05); border-color: var(--gold-dim); }

  .film-title { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; letter-spacing: 0.05em; margin: 0; color: var(--gold); }
  .film-meta { font-size: 12px; color: var(--gold-mute); margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .film-desc { font-size: 14px; line-height: 1.6; color: var(--ink); margin: 6px 0 16px; font-weight: 400; flex-grow: 1; }
  
  .film-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; border-top: 1px solid var(--line); padding-top: 16px; }
  
  .watched-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); cursor: pointer; transition: color 0.2s; }
  .watched-check:hover { color: var(--ink); }
  .watched-check input { accent-color: var(--gold); cursor: pointer; width: 18px; height: 18px; }

  .imdb-link { font-size: 13px; font-weight: 600; text-decoration: none; color: var(--black); background: var(--gold); padding: 8px 16px; border-radius: 8px; transition: all 0.2s; }
  .imdb-link:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }

  .loading-container { padding: 60px 0; display: flex; flex-direction: column; justify-content: center; align-items: center; grid-column: 1 / -1; }
  .loading-ring { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(212, 175, 55, 0.1); border-radius: 50%; border-top-color: var(--gold); animation: spin 1s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; color: var(--ink-muted); font-size: 14px; margin: 60px 0; letter-spacing: 0.02em; grid-column: 1 / -1; }
  
  .actions { display: flex; gap: 12px; margin-top: 30px; grid-column: 1 / -1; }
  .btn { flex: 1; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 600; padding: 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--gold); background: transparent; color: var(--gold); transition: all 0.3s; text-transform: uppercase; letter-spacing: 0.05em; }
  .btn.primary { background: var(--gold); color: var(--black); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15); }
  .btn.primary:hover { box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3); transform: translateY(-2px); }

  .source-badge { text-align:center; font-size:10px; color:var(--gold-dim); letter-spacing:0.1em; margin-bottom: 20px; grid-column: 1 / -1; }

  /* COLLECTION VIEW */
  #collection-view { display: none; }
  .collection-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .collection-item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  .col-title { font-family: 'Cinzel', serif; color: var(--gold); font-size: 18px; margin: 0 0 4px 0; font-weight: 700; }
  .col-meta { font-size: 12px; color: var(--ink-muted); margin: 0; }
  .remove-btn { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; }
  .remove-btn:hover { background: var(--red); color: #fff; }

  /* DESKTOP MEDIA QUERIES */
  @media (min-width: 900px) {
    .layout-grid { flex-direction: row; gap: 48px; align-items: flex-start; }
    .sidebar { flex: 0 0 280px; position: sticky; top: 40px; border-right: 1px solid rgba(212, 175, 55, 0.08); padding-right: 32px; }
    .header { text-align: left; margin-bottom: 40px; }
    .title { font-size: 52px; }
    .genres-scroll { flex-wrap: wrap; overflow-x: visible; gap: 8px; margin-bottom: 32px; padding-bottom: 0; }
    .genre-chip { padding: 8px 16px; font-size: 12px; }
    .main-content { min-width: 0; }
    .stage { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .collection-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .collection-header { font-size: 32px; }
  }
</style>
</head>
<body>

<div id="app-root">
  <div class="layout-grid">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="header" onclick="showDiscover()">
        <h1 class="title">Flickeys</h1>
        <p class="sub">Premium Curations</p>
      </div>

      <button class="collection-btn" id="btn-collection" onclick="showCollection()">View Logged Collection (<span id="collection-count">0</span>)</button>

      <div id="controls-section">
        <span class="nav-group-label">Format</span>
        <div class="toggle-group" id="format-toggle">
          <button class="toggle-btn active" data-val="Movies">Movies</button>
          <button class="toggle-btn" data-val="TV Shows">TV Shows</button>
        </div>

        <span class="nav-group-label">Region</span>
        <div class="toggle-group" id="region-toggle">
          <button class="toggle-btn active" data-val="English">English</button>
          <button class="toggle-btn" data-val="Hindi">Hindi</button>
          <button class="toggle-btn" data-val="South Indian">South Indian</button>
          <button class="toggle-btn" data-val="Korean">Korean</button>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      
      <!-- DISCOVER VIEW -->
      <div id="discover-view">
        <div class="genres-scroll" id="genres-scroll"></div>
        <div class="stage" id="stage"></div>
        <div class="empty" id="empty-state">Select a genre to generate your premium lineup.</div>
        <div class="actions" id="actions" style="display: none;">
          <button class="btn primary" id="btn-reroll">Refresh Lineup</button>
        </div>
      </div>

      <!-- COLLECTION VIEW -->
      <div id="collection-view">
        <h2 style="font-family: 'Cinzel'; color: var(--gold); font-size: 28px; margin-top: 0; margin-bottom: 24px; border-bottom: 1px solid var(--line); padding-bottom: 16px;">My Logged Collection</h2>
        <div class="collection-grid" id="collection-grid"></div>
        <div class="empty" id="collection-empty" style="display:none;">You haven't logged any titles yet.</div>
      </div>

    </div>
  </div>
</div>

  let currentRegion = 'English';

  let watched = { films: [] };
  let sessionSeen = { films: [] };

  const stageEl = document.getElementById('stage');

  const actionsEl = document.getElementById('actions');

  const discoverView = document.getElementById('discover-view');
  const collectionView = document.getElementById('collection-view');

  function loadWatched() {
    try {
      const raw = localStorage.getItem('flickeys-watched-v5');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.films) watched.films = parsed.films;
      }
    } catch (e) { watched = { films: [] }; }
    updateColCount();
  }

  function saveWatched() {
    try { localStorage.setItem('flickeys-watched-v5', JSON.stringify(watched)); } catch (e) {}
    updateColCount();
  }

  function updateColCount() {
    colCountEl.textContent = watched.films.length;
  }

  window.showDiscover = function() {
    collectionView.style.display = 'none';
    discoverView.style.display = 'block';
    controlsSection.style.display = 'block';
  }

  window.showCollection = function() {
    discoverView.style.display = 'none';
    controlsSection.style.display = 'none';
    collectionView.style.display = 'block';
    renderCollection();
  }

  function renderCollection() {
    const grid = document.getElementById('collection-grid');
    const empty = document.getElementById('collection-empty');
    grid.innerHTML = '';
    
    if (watched.films.length === 0) {
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    const reversed = [...watched.films].reverse();

    reversed.forEach(filmStr => {
        const match = filmStr.match(/(.+?)\s*\((\d{4})\)/);
        const title = match ? match[1] : filmStr;
        const year = match ? match[2] : "";

        const item = document.createElement('div');
        item.className = 'collection-item';
        item.innerHTML = `
            <div>
                <h4 class="col-title">${title}</h4>
                <p class="col-meta">${year}</p>
            </div>
            <button class="remove-btn">Remove</button>
        `;

        item.querySelector('.remove-btn').addEventListener('click', () => {
            watched.films = watched.films.filter(f => f !== filmStr);
            saveWatched();
            renderCollection();
            const checkbox = document.querySelector(`.watched-check input[value="${filmStr}"]`);
            if (checkbox) checkbox.checked = false;
        });

        grid.appendChild(item);
    });
  }

  function getOfflinePicks(genre, region, format) {
    const list = (MOVIE_DB[region] && MOVIE_DB[region][format] && MOVIE_DB[region][format][genre]) ? MOVIE_DB[region][format][genre] : [];
    
    let unwatched = list.filter(m => !watched.films.includes(`${m.title} (${m.year})`));
    if (unwatched.length < 3) unwatched = list; 

    let available = unwatched.filter(m => !sessionSeen.films.includes(`${m.title} (${m.year})`));

    if (available.length < 3) {
        const currentlyOnScreen = sessionSeen.films.slice(-3);
        sessionSeen.films = [...currentlyOnScreen];
        available = unwatched.filter(m => !sessionSeen.films.includes(`${m.title} (${m.year})`));
        if (available.length < 3) available = unwatched;
    }

    const shuffled = [...available].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, 3).map(p => ({...p, source: 'offline'}));
  }

  async function fetchPicks(genre, region, format) {
    const avoidList = [...new Set([...watched.films, ...sessionSeen.films])].slice(-30);
    
    const promptText = `Provide 3 highly rated ${region} ${format} in the genre '${genre}'. EXCLUDE: ${avoidList.join(', ')}. Respond strictly in raw JSON without formatting: {"films":[{"title":"...","year":"YYYY","genre":"...","desc":"Brief plot.","imdb_rating":"X.X"}]}`;

    try {
        const response = await fetch('https://text.pollinations.ai/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messages: [
                    { role: 'system', content: 'You are an API returning valid raw JSON only. No markdown, no conversational text.' },
                    { role: 'user', content: promptText }
                ],
                model: 'openai',
                jsonMode: true,
                seed: Math.floor(Math.random() * 999999)
            })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        let text = await response.text();
        text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
        const firstBrace = text.indexOf('{');
        const lastBrace = text.lastIndexOf('}');
        if (firstBrace !== -1 && lastBrace !== -1) text = text.substring(firstBrace, lastBrace + 1);
        
        const parsed = JSON.parse(text);
        if (parsed.films && parsed.films.length >= 3) return parsed.films.slice(0, 3).map(p => ({...p, source: 'ai'}));
        
        throw new Error("Invalid structure");
    } catch (error) {
        console.warn(`AI failed: ${error.message}. Using offline DB.`);
        return getOfflinePicks(genre, region, format);
    }
  }

    emptyEl.style.display = 'none';
    actionsEl.style.display = 'none';

    const picks = await fetchPicks(genre, currentRegion, currentFormat);
    
    stageEl.innerHTML = '';
    
    const sourceIndicator = picks[0].source === 'ai'

    stageEl.innerHTML += sourceIndicator;

    picks.forEach((film, index) => {
        const filmId = `${film.title} (${film.year})`;
        sessionSeen.films.push(filmId);
        
        const q = encodeURIComponent(`${film.title} ${film.year}`);
        const imdbUrl = `https://www.imdb.com/find/?q=${q}&s=tt`;
        const isWatched = watched.films.includes(filmId);

        const card = document.createElement('div');
        card.className = 'film-card';
        card.innerHTML = `
          <h3 class="film-title">${film.title}</h3>
          <p class="film-meta">${film.year} &bull; ${film.genre}</p>
          <p class="film-desc">${film.desc}</p>
          <div class="film-footer">
            <label class="watched-check">
              <input type="checkbox" value="${filmId}" ${isWatched ? 'checked' : ''}>
              Watched
            </label>
            <a class="imdb-link" href="${imdbUrl}" target="_blank" rel="noopener noreferrer">&#9733; ${film.imdb_rating || "N/A"} IMDb ↗</a>
          </div>
        `;
        
        card.querySelector('input').addEventListener('change', (e) => {
            if (e.target.checked) {
                if (!watched.films.includes(filmId)) watched.films.push(filmId);
            } else {
                watched.films = watched.films.filter(id => id !== filmId);
            }
            saveWatched();
            updateColCount();
        });
        
        stageEl.appendChild(card);
        setTimeout(() => { card.classList.add('reveal'); }, 50 + (index * 120));
    });
    
    setTimeout(() => { actionsEl.style.display = 'flex'; }, 400);
  }

  function setupToggle(groupId, stateVarName) {
    document.getElementById(groupId).addEventListener('click', (e) => {
        const btn = e.target.closest('.toggle-btn');
        if (btn) {
            document.querySelectorAll(`#${groupId} .toggle-btn`).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (stateVarName === 'region') currentRegion = btn.dataset.val;
            if (stateVarName === 'format') currentFormat = btn.dataset.val;
            
            sessionSeen.films = []; 
            if (currentGenre) pickAndRender(currentGenre);
        }
    });
  }

  document.getElementById('btn-reroll').addEventListener('click', () => {
      if (currentGenre) pickAndRender(currentGenre);
  });

  function init() {
    loadWatched();
    
    setupToggle('region-toggle', 'region');
    setupToggle('format-toggle', 'format');

    GENRES.forEach(genre => {
      const chip = document.createElement('button');
      chip.className = 'genre-chip';
      chip.textContent = genre;
      chip.addEventListener('click', (e) => {
        const targetChip = e.target.closest('.genre-chip');
        if (targetChip) {
            document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
            targetChip.classList.add('active');
            sessionSeen.films = []; 
            pickAndRender(genre);
        }
      });
      genresEl.appendChild(chip);
    });
  }

  init();
})();
</script>
</body>
</html>
