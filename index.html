<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flickeys">
<title>Flickeys</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap');

  :root {
    --black: #050505;
    --panel: #0d0d0d;
    --panel-hover: #141414;
    --gold: #D4AF37;
    --gold-dim: rgba(212, 175, 55, 0.4);
    --gold-mute: #C5A059;
    --red: #E6394A;
    --ink: #F5F5F5;
    --ink-muted: #888888;
    --line: rgba(212, 175, 55, 0.15);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--black); font-family: 'Work Sans', sans-serif; color: var(--ink); min-height: 100vh; }

  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }

  #app-root {
    min-height: 100vh;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 36px 20px;
  }

  .layout-grid { display: flex; flex-direction: column; gap: 32px; }

  .sidebar { width: 100%; }
  
  .header { text-align: center; margin-bottom: 24px; cursor: pointer; }
  .title {
    font-family: 'Cinzel', serif; font-size: 42px; font-weight: 700; letter-spacing: 0.15em; margin: 0;
    background: linear-gradient(to right, #D4AF37, #FFF5D1, #D4AF37);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2); text-transform: uppercase;
  }
  .sub { color: var(--ink-muted); font-size: 13px; margin: 6px 0 0; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 500; }

  .nav-group-label { font-size: 11px; color: var(--gold-mute); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; display: block; }

  .toggle-group {
    display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); flex-wrap: wrap;
  }
  .toggle-btn {
    flex: 1; min-width: 45%; font-family: 'Work Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink-muted); background: transparent; border: none; border-radius: 8px; padding: 12px 6px; cursor: pointer; transition: all 0.2s ease-out; text-align: center;
  }
  .toggle-btn:hover { color: var(--ink); }
  .toggle-btn.active { background: var(--gold); color: var(--black); font-weight: 600; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }

  .collection-btn {
    width: 100%; background: transparent; border: 1px dashed var(--gold-dim); color: var(--gold); padding: 14px; border-radius: 12px; font-family: 'Work Sans'; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 20px;
  }
  .collection-btn:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); }

  .main-content { flex: 1; min-width: 0; }

  .genres-wrap {
    display: flex; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; margin-bottom: 24px; scrollbar-width: none;
  }
  .genres-wrap::-webkit-scrollbar { display: none; }
  
  .genre-chip {
    flex-shrink: 0; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 100px; padding: 10px 20px; cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
  }
  .genre-chip:hover { background: var(--panel-hover); border-color: var(--gold-dim); }
  .genre-chip.active { background: var(--gold); color: var(--black); border-color: var(--gold); font-weight: 600; box-shadow: 0 0 12px rgba(212, 175, 55, 0.25); }

  .stage { width: 100%; display: grid; grid-template-columns: 1fr; gap: 18px; align-items: stretch; }
  
  .film-card {
    background: linear-gradient(145deg, var(--panel), #0a0a0a); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transform: translateY(20px) scale(0.98); filter: blur(4px); transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  }
  .film-card.reveal { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  .film-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(212, 175, 55, 0.08); border-color: var(--gold-dim); }

  .film-title { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; letter-spacing: 0.05em; margin: 0; color: var(--gold); line-height: 1.2; }
  .film-meta { font-size: 12px; color: var(--gold-mute); margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .film-desc { font-size: 14px; line-height: 1.5; color: var(--ink); margin: 6px 0 16px; font-weight: 400; flex-grow: 1; }
  
  .film-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; border-top: 1px solid var(--line); padding-top: 16px; }
  
  .watched-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); cursor: pointer; transition: color 0.2s; user-select: none; }
  .watched-check:hover { color: var(--ink); }
  .watched-check input { accent-color: var(--gold); cursor: pointer; width: 18px; height: 18px; margin: 0; }

  .imdb-link { font-size: 12px; font-weight: 600; text-decoration: none; color: var(--black); background: var(--gold); padding: 8px 14px; border-radius: 8px; transition: all 0.2s; white-space: nowrap; }
  .imdb-link:hover { transform: scale(1.05); box-shadow: 0 0 12px rgba(212, 175, 55, 0.4); }

  .loading-container { padding: 60px 0; display: flex; flex-direction: column; justify-content: center; align-items: center; grid-column: 1 / -1; }
  .loading-ring { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(212, 175, 55, 0.1); border-radius: 50%; border-top-color: var(--gold); animation: spin 1s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; color: var(--ink-muted); font-size: 14px; margin: 60px 0; letter-spacing: 0.02em; grid-column: 1 / -1; padding: 0 20px; line-height: 1.5; }
  
  .actions { display: flex; gap: 12px; margin-top: 28px; grid-column: 1 / -1; }
  .btn { flex: 1; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 600; padding: 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--gold); background: transparent; color: var(--gold); transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; }
  .btn.primary { background: var(--gold); color: var(--black); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15); }
  .btn.primary:hover { box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3); transform: translateY(-2px); }

  .source-badge { text-align:center; font-size:10px; color:var(--gold-dim); letter-spacing:0.1em; margin-bottom: 16px; grid-column: 1 / -1; font-weight: 600; }

  /* COLLECTION VIEW */
  #collection-view { display: none; }
  .collection-header-wrap { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 24px; }
  .collection-header { font-family: 'Cinzel', serif; color: var(--gold); font-size: 24px; margin: 0; }
  .back-btn { background: transparent; border: 1px solid var(--gold-dim); color: var(--gold); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
  .back-btn:hover { background: var(--gold); color: var(--black); border-color: var(--gold); }
  
  .collection-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .collection-item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .col-title { font-family: 'Cinzel', serif; color: var(--gold); font-size: 16px; margin: 0 0 4px 0; font-weight: 700; line-height: 1.2; }
  .col-meta { font-size: 12px; color: var(--ink-muted); margin: 0; }
  .remove-btn { flex-shrink: 0; background: transparent; border: 1px solid var(--red); color: var(--red); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; }
  .remove-btn:hover { background: var(--red); color: #fff; }

  /* RESPONSIVE DESKTOP LAYOUT */
  @media (min-width: 900px) {
    #app-root { padding: 48px 32px; }
    .layout-grid { flex-direction: row; gap: 56px; align-items: flex-start; }
    .sidebar { flex: 0 0 300px; position: sticky; top: 48px; border-right: 1px solid rgba(212, 175, 55, 0.08); padding-right: 40px; }
    .header { text-align: left; margin-bottom: 40px; }
    .title { font-size: 52px; }
    .genres-wrap { flex-wrap: wrap; overflow-x: visible; gap: 10px; margin-bottom: 32px; padding-bottom: 0; }
    .genre-chip { padding: 9px 18px; font-size: 12.5px; }
    .main-content { min-width: 0; }
    .stage { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .collection-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .collection-header { font-size: 32px; }
  }
</style>
</head>
<body>

<div id="app-root">
  <div class="layout-grid">
    
    <!-- SIDEBAR / CONTROLS -->
    <div class="sidebar">
      <div class="header" onclick="showDiscover()">
        <h1 class="title">Flickeys</h1>
        <p class="sub">Curated Movies & Shows</p>
      </div>

      <button class="collection-btn" id="btn-collection" onclick="showCollection()">
        Logged Collection (<span id="collection-count">0</span>)
      </button>

      <div id="controls-section">
        <span class="nav-group-label">Format</span>
        <div class="toggle-group" id="format-toggle">
          <button class="toggle-btn active" data-val="Movies">Movies</button>
          <button class="toggle-btn" data-val="TV Shows">TV Shows</button>
        </div>

        <span class="nav-group-label">Region</span>
        <div class="toggle-group" id="region-toggle">
          <button class="toggle-btn active" data-val="English">English</button>
          <button class="toggle-btn" data-val="Hindi">Hindi</button>
          <button class="toggle-btn" data-val="South Indian">South Indian</button>
          <button class="toggle-btn" data-val="Korean">Korean</button>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="main-content">
      
      <!-- DISCOVER VIEW -->
      <div id="discover-view">
        <div class="genres-wrap" id="genres-wrap"></div>
        <div class="stage" id="stage"></div>
        <div class="empty" id="empty-state">Select a genre to browse recommendations.</div>
        <div class="actions" id="actions" style="display: none;">
          <button class="btn primary" id="btn-reroll">Refresh Lineup</button>
        </div>
      </div>

      <!-- COLLECTION VIEW -->
      <div id="collection-view">
        <div class="collection-header-wrap">
          <h2 class="collection-header">My Logged Collection</h2>
          <button class="back-btn" onclick="showDiscover()">← Back to Browse</button>
        </div>
        <div class="collection-grid" id="collection-grid"></div>
        <div class="empty" id="collection-empty" style="display:none;">You haven't logged any titles yet.</div>
      </div>

    </div>
  </div>
</div>

(function() {
  const GENRES = ["Action / Thriller", "Romantic", "Rom-Com", "Horror", "Sci-Fi", "Drama", "Mystery / Crime", "Comedy", "Animation / Family"];

        ],

          {"title": "Black Mirror", "year": "2011", "genre": "Sci-Fi / Drama", "desc": "An anthology series exploring a twisted, high-tech multiverse where humanity's greatest innovations collide.", "imdb_rating": "8.7"},
          {"title": "The Mandalorian", "year": "2019", "genre": "Action / Sci-Fi", "desc": "The travels of a lone bounty hunter in the outer reaches of the galaxy far from the New Republic.", "imdb_rating": "8.7"}
        ]
      }
    },
    "Hindi": {
      "Movies": {
        "Action / Thriller": [
          {"title": "Gangs of Wasseypur", "year": "2012", "genre": "Crime / Action", "desc": "A clash between Sultan and Shahid Khan ignites a deadly blood feud spanning generations.", "imdb_rating": "8.2"},
          {"title": "Drishyam", "year": "2015", "genre": "Crime / Thriller", "desc": "Desperate measures are taken by a man who tries to save his family from the dark side of the law.", "imdb_rating": "8.2"},

          {"title": "Mirzapur", "year": "2018", "genre": "Action / Crime", "desc": "A iron-fisted mafia don and his aspiring son rule over a lawless city in Uttar Pradesh.", "imdb_rating": "8.5"},
          {"title": "Sacred Games", "year": "2018", "genre": "Crime / Thriller", "desc": "A troubled police officer receives a clue from a fugitive gang boss about a terrorist attack in Mumbai.", "imdb_rating": "8.5"},
          {"title": "Paatal Lok", "year": "2020", "genre": "Crime / Drama", "desc": "A cynical inspector is tasked with investigating a high-profile assassination attempt gone wrong.", "imdb_rating": "8.1"}
        ]
      }
    },
    "South Indian": {
      "Movies": {
        "Action / Thriller": [
          {"title": "K.G.F: Chapter 1", "year": "2018", "genre": "Action / Crime", "desc": "A fierce gangster goes undercover as a slave to assassinate the owner of a notorious gold mine.", "imdb_rating": "8.2"},
          {"title": "RRR", "year": "2022", "genre": "Action / Drama", "desc": "A fictitious saga about two legendary revolutionaries and their epic journey away from home.", "imdb_rating": "7.8"},
          {"title": "Vikram", "year": "2022", "genre": "Action / Thriller", "desc": "A elite black-ops special agent investigates a series of murders committed by masked vigilantes.", "imdb_rating": "8.3"}
        ]
      },
      "TV Shows": {
        "Action / Thriller": [
          {"title": "Suzhal: The Vortex", "year": "2022", "genre": "Crime / Mystery", "desc": "A small-town investigation into a missing girl unearths dark cultural secrets and corporate corruption.", "imdb_rating": "8.0"},
          {"title": "Vadha Rani", "year": "2023", "genre": "Action / Drama", "desc": "A gripping regional thriller centering on power struggles and family loyalty.", "imdb_rating": "7.8"}
        ]
      }
    },
    "Korean": {
      "Movies": {
        "Action / Thriller": [
          {"title": "Parasite", "year": "2019", "genre": "Comedy / Drama", "desc": "Greed and class discrimination threaten the newly formed symbiotic relationship between two families.", "imdb_rating": "8.5"},
          {"title": "Oldboy", "year": "2003", "genre": "Action / Mystery", "desc": "After being kidnapped and imprisoned for 15 years, a man seeks vengeance against his captor.", "imdb_rating": "8.4"},
          {"title": "Train to Busan", "year": "2016", "genre": "Action / Horror", "desc": "Passengers struggle to survive on a high-speed train during a sudden nationwide zombie outbreak.", "imdb_rating": "7.6"}
        ]
      },
      "TV Shows": {
        "Action / Thriller": [
          {"title": "Squid Game", "year": "2021", "genre": "Action / Mystery", "desc": "Hundreds of cash-strapped contestants accept an invitation to compete in deadly children's games.", "imdb_rating": "8.0"},
          {"title": "All of Us Are Dead", "year": "2022", "genre": "Action / Horror", "desc": "A high school becomes ground zero for a zombie virus outbreak, trapping students inside.", "imdb_rating": "7.5"},
          {"title": "Kingdom", "year": "2019", "genre": "Action / History", "desc": "While investigating a mysterious plague in Joseon, a crown prince discovers a terrifying epidemic.", "imdb_rating": "8.4"}
        ]
      }
    }
  };

  let currentFormat = 'Movies';
  let currentRegion = 'English';
  let currentGenre = null;
  let watched = { films: [] };
  let sessionSeen = { films: [] };

  const stageEl = document.getElementById('stage');
  const genresWrapEl = document.getElementById('genres-wrap');
  const emptyEl = document.getElementById('empty-state');
  const actionsEl = document.getElementById('actions');
  const colCountEl = document.getElementById('collection-count');
  
  const discoverView = document.getElementById('discover-view');
  const collectionView = document.getElementById('collection-view');

  function loadWatched() {
    try {
      const raw = localStorage.getItem('flickeys-watched-v5');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.films) watched.films = parsed.films;
      }
    } catch (e) { watched = { films: [] }; }
    updateColCount();
  }

  function saveWatched() {
    try { localStorage.setItem('flickeys-watched-v5', JSON.stringify(watched)); } catch (e) {}
    updateColCount();
  }

  function updateColCount() {
    colCountEl.textContent = watched.films.length;
  }

  window.showDiscover = function() {
    collectionView.style.display = 'none';
    discoverView.style.display = 'block';
  }

  window.showCollection = function() {
    discoverView.style.display = 'none';
    collectionView.style.display = 'block';
    renderCollection();
  }

  function renderCollection() {
    const grid = document.getElementById('collection-grid');
    const empty = document.getElementById('collection-empty');
    grid.innerHTML = '';
    
    if (watched.films.length === 0) {
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    const reversed = [...watched.films].reverse();

    reversed.forEach(filmStr => {
        const match = filmStr.match(/(.+?)\s*\((\d{4})\)/);
        const title = match ? match[1] : filmStr;
        const year = match ? match[2] : "";

        const item = document.createElement('div');
        item.className = 'collection-item';
        item.innerHTML = `
            <div>
                <h4 class="col-title">${title}</h4>
                <p class="col-meta">${year}</p>
            </div>
            <button class="remove-btn">Remove</button>
        `;

        item.querySelector('.remove-btn').addEventListener('click', () => {
            watched.films = watched.films.filter(f => f !== filmStr);
            saveWatched();
            renderCollection();
            
            const checkbox = document.querySelector(`.watched-check input[value="${filmStr}"]`);
            if (checkbox) checkbox.checked = false;
        });

        grid.appendChild(item);
    });
  }

  function getOfflinePicks(genre, region, format) {
    const regObj = MOVIE_DB[region] || MOVIE_DB["English"];
    const fmtObj = (regObj && regObj[format]) ? regObj[format] : (regObj ? regObj["Movies"] : {});
    const list = (fmtObj && fmtObj[genre]) ? fmtObj[genre] : [
      {"title": "Inception", "year": "2010", "genre": "Sci-Fi", "desc": "A thief steals corporate secrets through dreams.", "imdb_rating": "8.8"},
      {"title": "Gladiator", "year": "2000", "genre": "Action", "desc": "A former Roman General seeks vengeance.", "imdb_rating": "8.5"},
      {"title": "Titanic", "year": "1997", "genre": "Romance", "desc": "An artist falls for a rich girl on the ship.", "imdb_rating": "7.9"}
    ];
    
    let unwatched = list.filter(m => !watched.films.includes(`${m.title} (${m.year})`));
    if (unwatched.length < 3) unwatched = list;

    let available = unwatched.filter(m => !sessionSeen.films.includes(`${m.title} (${m.year})`));

    if (available.length < 3) {
        sessionSeen.films = [];
        available = unwatched;
    }

    const shuffled = [...available].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, 3).map(p => ({...p, source: 'offline'}));
  }

  async function fetchPicks(genre, region, format) {
    const avoidList = [...new Set([...watched.films, ...sessionSeen.films])].slice(-30);
    
    const promptText = `Suggest exactly 3 highly rated ${region} ${format} in the genre '${genre}'. Exclude these: ${avoidList.join(', ')}. Respond ONLY with valid raw JSON in this exact format: {"films":[{"title":"...","year":"YYYY","genre":"...","desc":"One short sentence description.","imdb_rating":"X.X"}]}`;

    const url = `https://text.pollinations.ai/${encodeURIComponent(promptText)}?model=openai&json=true`;

    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

        let text = await response.text();
        text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
        
        const firstBrace = text.indexOf('{');
        const lastBrace = text.lastIndexOf('}');
        if (firstBrace !== -1 && lastBrace !== -1) {
            text = text.substring(firstBrace, lastBrace + 1);
        }
        
        const parsed = JSON.parse(text);
        if (parsed.films && parsed.films.length >= 3) {
            return parsed.films.slice(0, 3).map(p => ({...p, source: 'ai'}));
        }
        
        throw new Error("Invalid JSON structure from AI.");
    } catch (error) {
        console.warn(`AI failed: ${error.message}. Using curated offline DB.`);
        return getOfflinePicks(genre, region, format);
    }
  }

  async function pickAndRender(genre) {
    currentGenre = genre;
    stageEl.innerHTML = `<div class="loading-container"><div class="loading-ring"></div><p style="color:var(--gold-dim); margin-top:20px; font-size:12px; letter-spacing:0.1em;">CURATING LINEUP...</p></div>`;
    emptyEl.style.display = 'none';
    actionsEl.style.display = 'none';

    try {
        const picks = await fetchPicks(genre, currentRegion, currentFormat);
        
        stageEl.innerHTML = '';
        
        const sourceIndicator = picks[0].source === 'ai' 
            ? `<div class="source-badge">✦ GENERATED BY AI</div>`
            : `<div class="source-badge" style="color:var(--ink-muted);">✦ CURATED DATABASE</div>`;
        stageEl.innerHTML += sourceIndicator;

        picks.forEach((film, index) => {
            const filmId = `${film.title} (${film.year})`;
            sessionSeen.films.push(filmId);
            
            const q = encodeURIComponent(`${film.title} ${film.year}`);
            const imdbUrl = `https://www.imdb.com/find/?q=${q}&s=tt`;
            const isWatched = watched.films.includes(filmId);

            const card = document.createElement('div');
            card.className = 'film-card';
            card.innerHTML = `
              <h3 class="film-title">${film.title}</h3>
              <p class="film-meta">${film.year} &bull; ${film.genre}</p>
              <p class="film-desc">${film.desc}</p>
              <div class="film-footer">
                <label class="watched-check">
                  <input type="checkbox" value="${filmId}" ${isWatched ? 'checked' : ''}>
                  Watched
                </label>
                <a class="imdb-link" href="${imdbUrl}" target="_blank" rel="noopener noreferrer">&#9733; ${film.imdb_rating || "N/A"} IMDb ↗</a>
              </div>
            `;
            
            card.querySelector('input').addEventListener('change', (e) => {
                if (e.target.checked) {
                    if (!watched.films.includes(filmId)) watched.films.push(filmId);
                } else {
                    watched.films = watched.films.filter(id => id !== filmId);
                }
                saveWatched();
                updateColCount();
            });
            
            stageEl.appendChild(card);
            setTimeout(() => { card.classList.add('reveal'); }, 50 + (index * 120));
        });
    } catch (error) {
        console.error(error);
        stageEl.innerHTML = `<div class="empty" style="color: var(--red);">Unable to generate lineup right now. Please check your connection and try refreshing.</div>`;
    }
    
    setTimeout(() => { actionsEl.style.display = 'flex'; }, 400);
  }

  function setupToggle(groupId, stateVarName) {
    document.getElementById(groupId).addEventListener('click', (e) => {
        const btn = e.target.closest('.toggle-btn');
        if (btn) {
            document.querySelectorAll(`#${groupId} .toggle-btn`).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (stateVarName === 'region') currentRegion = btn.dataset.val;
            if (stateVarName === 'format') currentFormat = btn.dataset.val;
            
            sessionSeen.films = []; 
            if (currentGenre && discoverView.style.display !== 'none') pickAndRender(currentGenre);
        }
    });
  }

  document.getElementById('btn-reroll').addEventListener('click', () => {
      if (currentGenre) pickAndRender(currentGenre);
  });

  function init() {
    loadWatched();
    
    setupToggle('region-toggle', 'region');
    setupToggle('format-toggle', 'format');

    GENRES.forEach(genre => {
      const chip = document.createElement('button');
      chip.className = 'genre-chip';
      chip.textContent = genre;
      chip.addEventListener('click', (e) => {
        const targetChip = e.target.closest('.genre-chip');
        if(targetChip) {
            document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
            targetChip.classList.add('active');
            sessionSeen.films = []; 
            pickAndRender(genre);
        }
      });
      genresWrapEl.appendChild(chip);
    });
  }

  init();
})();
</script>
</body>
</html>
